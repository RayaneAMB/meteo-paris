<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Météo Paris</title>
    <style>
        /* --- LE DESIGN (CSS) MIS À JOUR --- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #e0f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .carte-meteo {
            background-color: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            text-align: center;
            width: 300px;
        }
        h1 { margin: 0; color: #333; font-size: 2em; }
        .temperature { font-size: 4em; font-weight: bold; color: #0277bd; margin: 0; }
        .description { font-size: 1.2em; color: #666; text-transform: capitalize; margin-bottom: 20px; }
        img { width: 100px; margin: -10px auto; display: none; } /* Caché au début */
        
        .details {
            display: flex;
            justify-content: space-between;
            border-top: 1px solid #eee;
            padding-top: 20px;
            margin-top: 20px;
            color: #555;
            font-size: 0.9em;
        }
    </style>
</head>
<body>

    <div class="carte-meteo">
        <h1 id="nom-ville">Chargement...</h1>
        
        <img id="icone-meteo" src="" alt="Icône météo">
        
        <div class="temperature" id="temperature">--°C</div>
        <div class="description" id="description">Veuillez patienter</div>
        
        <div class="details">
            <div>💧 <span id="humidite">--</span>%</div>
            <div>💨 <span id="vent">--</span> km/h</div>
        </div>
    </div>

    <script>
        async function afficherMeteo() {
            try {
                const reponse = await fetch('http://localhost:3000/api/meteo');
                const donnees = await reponse.json();

                // Les infos de base
                document.getElementById('nom-ville').innerText = donnees.name;
                document.getElementById('temperature').innerText = Math.round(donnees.main.temp) + "°C";
                document.getElementById('description').innerText = donnees.weather[0].description;

                // --- LES NOUVEAUTÉS ---

                // 1. L'icône : OpenWeatherMap donne un code (ex: "01d" pour soleil). On l'utilise pour créer le lien de l'image.
                const codeIcone = donnees.weather[0].icon;
                const baliseImage = document.getElementById('icone-meteo');
                baliseImage.src = `https://openweathermap.org/img/wn/${codeIcone}@2x.png`;
                baliseImage.style.display = 'block'; // On affiche l'image

                // 2. L'humidité
                document.getElementById('humidite').innerText = donnees.main.humidity;

                // 3. Le vent (L'API donne le vent en mètres/seconde, on multiplie par 3.6 pour avoir des km/h)
                const ventKmh = Math.round(donnees.wind.speed * 3.6);
                document.getElementById('vent').innerText = ventKmh;

            } catch (erreur) {
                console.error("Erreur :", erreur);
                document.getElementById('nom-ville').innerText = "Erreur";
            }
        }

        afficherMeteo();
    </script>
</body>
</html>
